description = "Semantic search of Scriptling's documentation (language, libraries, guides): rank pages by relevance to a natural-language query. Best for conceptual or paraphrased questions where you don't know the exact term (e.g. 'how do I make an HTTP request'). For exact keyword or identifier matching, use skb_grep."
keywords = ["scriptling", "documentation", "docs", "search", "semantic", "query", "find", "natural", "ask"]

[[parameters]]
name = "query"
type = "string"
description = "Natural-language query, e.g. 'how do I make an HTTP request' or 'concurrency and background tasks'."
required = true

[[parameters]]
name = "path"
type = "string"
description = "Scope: a bundle or folder path (e.g. 'scriptling-reference', 'scriptling-libraries'). Empty searches all bundles."

[[parameters]]
name = "top_k"
type = "int"
description = "Maximum number of results to return. Default 10."
