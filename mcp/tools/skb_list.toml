description = "Browse Scriptling's documentation (language reference, libraries, and guides). List the bundles (empty path), a folder's contents, or a single file's metadata. Use this to navigate before reading a page."
keywords = ["scriptling", "documentation", "docs", "reference", "libraries", "list", "browse", "folder", "navigate"]

[[parameters]]
name = "path"
type = "string"
description = "Path relative to the OKF root: a folder (e.g. 'scriptling-reference', 'scriptling-libraries'), a file (e.g. 'scriptling-libraries/cheat-sheet.md'), or empty to list the bundles."
