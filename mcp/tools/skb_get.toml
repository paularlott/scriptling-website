description = "Read one OKF concept file as raw markdown. If the path is a folder, or ends with /index.md, a directory listing is synthesized on the fly (no index.md files are committed). Use list_files first to find a path."
keywords = ["okf", "get", "read", "file", "concept", "fetch", "cat"]

[[parameters]]
name = "path"
type = "string"
description = "Path relative to the OKF root. A concept file (e.g. 'reference/builtins.md'), a folder (e.g. 'reference/libraries'), '<folder>/index.md' for a synthesized listing, or empty for the root bundle list."
