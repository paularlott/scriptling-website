baseURL = 'https://scriptling.dev/'
title = 'Scriptling'

# `tags` frontmatter is kept as OKF-style metadata only; do not generate
# taxonomy/term list pages for it.
disableKinds = ['taxonomy', 'term']

[outputs]
  home = ['HTML', 'JSON']

[params]
  githubURL = "https://github.com/paularlott/scriptling"
  copyright = "Paul Arlott"
  defaultTheme = "light"  # Options: "light" or "dark"
  includeSections = ["docs", "reference"]

  [params.navigation]
    [[params.navigation.header]]
      name = 'Home'
      url = '/'
    [[params.navigation.header]]
      name = 'Docs'
      url = '/docs'
    [[params.navigation.header]]
      name = 'Reference'
      url = '/reference'
    [[params.navigation.header]]
      name = 'Changelog'
      url = '/docs/changelog/'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[security]
  # The CSS pipeline shells out to tailwindcss (a Node script), so those
  # executables must be allowed. The first four entries are Hugo's own
  # defaults, restated so this list stays complete.
  [security.exec]
    allow = [
      '^(dart-)?sass(-embedded)?$',
      '^go$',
      '^npx$',
      '^postcss$',
      '^tailwindcss$',
      '^node$',
      '^npm$',
    ]

[module]
  [module.hugoVersion]
    extended = true
    min = '0.150.0'

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    #style = 'catppuccin-frappe'
    noClasses = false
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 2

  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = "assets/scss"
    target = "assets/scss"
  # static must be mounted explicitly once any static-target mount exists
  [[module.mounts]]
    source = "static"
    target = "static"
  # committed OKF bundles, published at /okf/ (generated by make okf)
  [[module.mounts]]
    source = "okf"
    target = "static/okf"
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'