{{ define "main" }}
{{ partial "breadcrumb.html" . }}

<div class="flex gap-8 mt-6">
  <article class="prose prose-lg dark:prose-invert max-w-none flex-1 min-w-0">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-6">{{ .Title }}</h1>
    {{ if .Params.requires_registration }}
    <div class="not-prose mb-6 flex items-center gap-2 rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm dark:border-amber-700 dark:bg-amber-950/50 dark:text-amber-200">
      <svg class="h-5 w-5 flex-shrink-0 text-amber-600 dark:text-amber-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
      <span>Requires <a href="{{ "docs/go-integration/library-registration/" | relURL }}" class="font-medium underline decoration-amber-500 underline-offset-2 hover:decoration-amber-600">library registration</a> when embedding in Go.</span>
    </div>
    {{ end }}
    <div class="text-gray-700 dark:text-gray-300 text-base">{{ .Content }}</div>
    {{ partial "prev-next.html" . }}
  </article>
  {{ partial "toc.html" . }}
</div>
{{ end }}
